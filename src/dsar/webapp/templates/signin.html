{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<main class="signin">
  <h1>Sign in</h1>
  <p class="muted">Your name is recorded with every decision and export you make in this session{% if settings.case_bound %} and in the case audit log{% endif %}.</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" autocomplete="name" autofocus required>
    <button class="btn primary">Continue</button>
  </form>
</main>
{% endblock %}
